[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleandog-cad"
version = "0.1.0"
description = "CleanDog mechanical CAD (build123d)"
requires-python = ">=3.11"
dependencies = ["build123d", "numpy", "matplotlib"]

[tool.setuptools]
packages = ["cleandog_cad"]
